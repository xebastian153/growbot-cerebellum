name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: pytest -q -m "not slow"
      - name: JS runner equivalence
        run: node test_forward.mjs
        working-directory: forward-model
      - name: Twin data
        # data/*.npz is gitignored and regenerated with the README's commands; the suite
        # trains its forward model on train.npz, forward.py scores on test.npz
        run: |
          python sim/growbot_sim.py --steps 400000 --seed 0 --out data/train.npz
          python sim/growbot_sim.py --steps 60000  --seed 1 --out data/test.npz
      - name: Round-trip suite
        run: pytest -q -m slow
      - name: Environment fingerprint
        # Diagnostic: which CPU did this runner get, and does the regenerated twin data
        # match the maintainer's (sha256 bc7d623af4edb75d / 6e27e50e8da71eee)?
        run: |
          lscpu | grep -E "Model name|^Flags" | sed -E 's/(Flags:).*/\1 avx512f='"$(grep -c avx512f /proc/cpuinfo)"'/'
          python - <<'PY'
          import hashlib, mujoco, numpy as np, torch
          print("mujoco", mujoco.__version__, "numpy", np.__version__, "torch", torch.__version__, "threads", torch.get_num_threads())
          for f in ("data/train.npz", "data/test.npz"):
              print(f, hashlib.sha256(open(f, "rb").read()).hexdigest()[:16])
          tr = np.load("data/train.npz")
          print("obs[0,:4]", tr["obs"][0, :4].tolist(), "obs[1000,:3]", tr["obs"][1000, :3].tolist())
          PY
      - name: Headline artifact reproduces
        # The documented command must give back the committed results/forward_K5.json at
        # the precision the tables quote (0.1 pt on rates, 1e-3 on RMSEs) — wall-clock
        # fit_s and the provenance block excluded. On a mismatch the step names every
        # differing key and the largest deviation, so the failure is actionable.
        run: |
          git show HEAD:results/forward_K5.json > committed_forward_K5.json
          python forward.py
          python - <<'PY'
          import json, sys
          TOL = 1e-3
          def strip(d):
              d.pop("provenance", None)
              for m in d.values():
                  if isinstance(m, dict): m.pop("fit_s", None)
              return d
          def leaves(d, pre=""):
              if isinstance(d, dict):
                  for k, v in d.items(): yield from leaves(v, f"{pre}/{k}")
              elif isinstance(d, list):
                  for i, v in enumerate(d): yield from leaves(v, f"{pre}[{i}]")
              else:
                  yield pre, d
          a = dict(leaves(strip(json.load(open("committed_forward_K5.json")))))
          b = dict(leaves(strip(json.load(open("results/forward_K5.json")))))
          bad, worst = [], 0.0
          for k in sorted(set(a) | set(b)):
              if k not in a or k not in b:
                  bad.append(f"{k}: present on one side only"); continue
              x, y = a[k], b[k]
              if isinstance(x, (int, float)) and not isinstance(x, bool) and isinstance(y, (int, float)):
                  d = abs(x - y); worst = max(worst, d)
                  if d > TOL: bad.append(f"{k}: committed {x} regenerated {y} (|d| {d:.3g})")
              elif x != y:
                  bad.append(f"{k}: committed {x!r} regenerated {y!r}")
          print(f"largest numeric deviation {worst:.3g} (tolerance {TOL})")
          if bad:
              print("\n".join(bad))
              sys.exit(f"results/forward_K5.json does not reproduce within {TOL}: {len(bad)} keys differ")
          print("results/forward_K5.json reproduces at the published precision")
          PY
